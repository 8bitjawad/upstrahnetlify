    <footer class="w-full text-white bg-[#1c1c1c] overflow-hidden">
  <!-- Single top border line -->

        <!-- Resources -->
        <div>
          <h2 class="mb-6 text-sm font-semibold text-white">Resources</h2>

        <!-- Follow Us -->

      <div class="mt-4 flex sm:mt-0 sm:justify-center">

</footer>
    <!-- footer ends here -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("menu-toggle");
        const menu = document.getElementById("mobile-menu");
        toggleBtn.addEventListener("click", function () {
          const isOpen = menu.classList.contains("max-h-0");
          if (isOpen) {
            menu.classList.remove("max-h-0", "opacity-0");
            menu.classList.add("max-h-96", "opacity-100");
          } else {
            menu.classList.add("max-h-0", "opacity-0");
            menu.classList.remove("max-h-96", "opacity-100");
          }
        });
      });
    </script>
  </body>
